spark.master                          spark://spark-mastere:7077

spark.eventLog.enabled                true
spark.eventLog.dir                    /opt/spark/spark-events
spark.history.fs.logDirectory         /opt/spark/spark-events

spark.sql.catalogImplementation       in-memory
spark.sql.extensions                  org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog              hnb

spark.sql.catalog.pgnb                org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.pgnb.type           Jdbc
spark.sql.catalog.pgnb.uri            jdbc:postgresql://postgres:5432/icebergcat
spark.sql.catalog.pgnb.jdbc.user      iceberg
spark.sql.catalog.pgnb.jdbc.password  iceberg
spark.sql.catalog.pgnb.warehouse      s3a://iceberg/pgnb
spark.sql.catalog.pgnb.io-impl        org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.pgnb.s3.endpoint    http://minio:9000

spark.sql.catalog.hnb                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.hnb.type            hadoop
spark.sql.catalog.hnb.warehouse       s3a://iceberg/dirwarehouse
